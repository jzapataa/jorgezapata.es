<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Jira Story Analyzer</title>
  <desc id="desc">Vista previa visual del flujo de análisis de una historia de Jira: story, gaps, estimability y resultado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30cdbc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#45417d" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="930" cy="115" r="145" fill="#45417d" opacity=".16" filter="url(#glow)"/>
  <circle cx="210" cy="610" r="130" fill="#30cdbc" opacity=".08" filter="url(#glow)"/>

  <g opacity=".16" stroke="#9ca3af" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
    <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
  </g>

  <rect x="72" y="70" width="1056" height="560" rx="22" fill="#111318" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="72" y="70" width="1056" height="58" rx="22" fill="#171a20"/>
  <rect x="72" y="106" width="1056" height="22" fill="#171a20"/>
  <circle cx="108" cy="99" r="6" fill="#f1c933"/>
  <circle cx="130" cy="99" r="6" fill="#30cdbc"/>
  <circle cx="152" cy="99" r="6" fill="#7f78d5"/>
  <text x="185" y="105" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6">JIRA STORY ANALYZER · v1.0.1</text>

  <text x="118" y="195" fill="#f5f5f2" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">¿Estamos preparados para estimar?</text>
  <text x="118" y="228" fill="#9ca3af" font-family="Inter, Arial, sans-serif" font-size="16">Primero analiza la definición. Las horas vienen después.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">
    <rect x="118" y="285" width="190" height="112" rx="13" fill="#171a20" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="140" y="319" fill="#f1c933">01 · STORY</text>
    <text x="140" y="350" fill="#d4d7dd" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0">Hechos y contexto</text>
    <text x="140" y="375" fill="#7f8792" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Qué sabemos realmente</text>

    <path d="M320 341H360" stroke="#f1c933" stroke-width="2"/>
    <path d="M352 333L360 341L352 349" fill="none" stroke="#f1c933" stroke-width="2"/>

    <rect x="372" y="285" width="190" height="112" rx="13" fill="#171a20" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="394" y="319" fill="#30cdbc">02 · GAPS</text>
    <text x="394" y="350" fill="#d4d7dd" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0">Dudas y riesgos</text>
    <text x="394" y="375" fill="#7f8792" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Qué falta por aclarar</text>

    <path d="M574 341H614" stroke="#f1c933" stroke-width="2"/>
    <path d="M606 333L614 341L606 349" fill="none" stroke="#f1c933" stroke-width="2"/>

    <rect x="626" y="285" width="208" height="112" rx="13" fill="url(#accent)" stroke="#f1c933" stroke-opacity=".34"/>
    <text x="648" y="319" fill="#f1c933">03 · ESTIMABILITY</text>
    <text x="648" y="350" fill="#f5f5f2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0">¿Es defendible?</text>
    <text x="648" y="375" fill="#aeb4bd" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0">Política determinista</text>

    <path d="M846 341H886" stroke="#f1c933" stroke-width="2"/>
    <path d="M878 333L886 341L878 349" fill="none" stroke="#f1c933" stroke-width="2"/>

    <rect x="898" y="285" width="184" height="112" rx="13" fill="#171a20" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="920" y="319" fill="#f1c933">04 · RESULT</text>
    <rect x="920" y="337" width="119" height="28" rx="6" fill="#30cdbc" fill-opacity=".12" stroke="#30cdbc" stroke-opacity=".4"/>
    <text x="935" y="356" fill="#8ee7dc" font-size="11">READY</text>
    <rect x="920" y="373" width="130" height="28" rx="6" fill="#f1c933" fill-opacity=".1" stroke="#f1c933" stroke-opacity=".34"/>
    <text x="935" y="392" fill="#f5d85d" font-size="11">NOT READY</text>
  </g>

  <rect x="118" y="453" width="964" height="116" rx="14" fill="#0d0f13" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="146" y="486" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">CORE PRINCIPLE</text>
  <text x="146" y="526" fill="#f5f5f2" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">Solo muestra horas cuando existe un rango defendible.</text>
  <rect x="852" y="484" width="190" height="45" rx="8" fill="#f1c933"/>
  <text x="947" y="512" text-anchor="middle" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">ANALYZE → DECIDE</text>
</svg>
